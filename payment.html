
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout | BYD Elite</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --gold: #D4AF37;
            --bg: #050505;
            --card: #111111;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .payment-card {
            background: var(--card);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--gold);
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .brand {
            font-size: 20px;
            color: var(--gold);
            letter-spacing: 5px;
            margin-bottom: 30px;
        }

        .timer-box {
            font-size: 48px;
            font-weight: 800;
            color: var(--gold);
            margin: 20px 0;
            font-family: 'Courier New', Courier, monospace;
        }

        .paypal-info {
            background: #003087;
            padding: 15px;
            border-radius: 10px;
            margin: 25px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: bold;
        }

        .instruction {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .signal-btn {
            display: inline-block;
            width: 100%;
            padding: 18px;
            background: #3273dc;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
            pointer-events: none; /* Disabled until payment done */
            opacity: 0.5;
        }

        .signal-btn.active {
            pointer-events: auto;
            opacity: 1;
            background: #2055b3;
            box-shadow: 0 0 15px rgba(50, 115, 220, 0.4);
        }

        .status-msg {
            font-size: 12px;
            margin-top: 15px;
            color: var(--gold);
        }
    </style>
</head>
<body>

    <div class="payment-card">
        <div class="brand">BYD SECURE PAY</div>
        <p>Transfer the total amount to our verified PayPal address below:</p>

        <div class="paypal-info">
            <i class="fab fa-paypal"></i> iibrahimismaela@gmail.com
        </div>

        <div class="timer-box" id="countdown">20</div>
        <p class="instruction">Please complete the transfer before the secure session expires.</p>

        <a href="#" id="signalBtn" class="signal-btn">
            <i class="fab fa-signal"></i> MESSAGE ON SIGNAL
        </a>
        
        <div id="status" class="status-msg">Waiting for payment confirmation...</div>
    </div>

    <script>
        let timeLeft = 20;
        const timerElement = document.getElementById('countdown');
        const signalBtn = document.getElementById('signalBtn');
        const statusMsg = document.getElementById('status');

        // Retrieve the cars from Session Storage
        let cart = JSON.parse(sessionStorage.getItem('byd_cart')) || [];
        let carNames = cart.map(item => item.name).join(', ');
        let total = cart.reduce((acc, curr) => acc + curr.price, 0);

        // Countdown Logic
        const timer = setInterval(() => {
            timeLeft--;
            timerElement.innerText = timeLeft < 10 ? '0' + timeLeft : timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timer);
                timerElement.innerText = "00";
                statusMsg.innerText = "Payment window closed. Please refresh.";
                statusMsg.style.color = "#ff4444";
            }
        }, 1000);

        // Simulation: After 5 seconds, "Payment" is assumed done for testing
        // In a real hosting site, the user would click the Signal button after paying.
        setTimeout(() => {
            if(timeLeft > 0) {
                signalBtn.classList.add('active');
                statusMsg.innerText = "Payment Window Secure. Click below to confirm.";
                
                // Construct the Signal Link with the Car Data
                const signalURL = "https://signal.me/#eu/nZC6gDsOQj7S5WSi1DrrXD6N0xUnaNtPFltIDZxGi_QRvmJ-Ym9PDqlZLphGLTmu";
                const message = encodeURIComponent(`Hello, I have made a payment of $${total.toLocaleString()} for the following vehicles: ${carNames}.`);
                
                // Note: Signal links usually don't support direct message injection via URL 
                // but this will take them to your profile as requested.
                signalBtn.href = signalURL;
            }
        }, 5000);
    </script>
</body>
</html>
