<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | BYD Luxury Elite</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --gold-gradient: linear-gradient(135deg, #D4AF37 0%, #F5E0A3 50%, #B8860B 100%);
            --bg-dark: #0a0a0a;
            --card-bg: #161616;
            --border-gold: #c5a059;
            --text-gray: #888;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #0a0a0a 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .signup-container {
            width: 100%;
            max-width: 450px;
            padding: 40px;
            background: var(--card-bg);
            border: 1px solid #222;
            border-top: 4px solid var(--border-gold);
            border-radius: 12px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            text-align: center;
        }

        .brand-logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 4px;
            color: var(--border-gold);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-gray);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #222;
            border: 1px solid #333;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--border-gold);
            outline: none;
            background: #2a2a2a;
        }

        .signup-btn {
            width: 100%;
            padding: 16px;
            background: var(--gold-gradient);
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 10px;
            transition: transform 0.2s;
        }

        .signup-btn:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
        }

        .footer-links {
            margin-top: 25px;
            font-size: 14px;
            color: var(--text-gray);
        }

        .footer-links a {
            color: var(--border-gold);
            text-decoration: none;
        }

        /* Luxury Accent Decor */
        .car-silhouette {
            font-size: 50px;
            color: #1a1a1a;
            position: absolute;
            bottom: 20px;
            right: 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <div class="brand-logo">BYD LUXURY</div>
        <h1>Create Your Account</h1>

        <form action="dashboard.html" method="GET">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" placeholder="e.g. John Doe" required>
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" placeholder="name@example.com" required>
            </div>

            <div class="input-group">
                <label>Preferred BYD Model</label>
                <input type="text" placeholder="e.g. BYD Han, Seal, or Tang">
            </div>

            <div class="input-group">
                <label>Create Password</label>
                <input type="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="signup-btn">Join the Elite</button>
        </form>

        <div class="footer-links">
            Already have an account? <a href="login.html">Login here</a>
        </div>
    </div>

    <i class="fas fa-car car-silhouette"></i>

</body>
</html>
